<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <!-- Brand Accent Gradient (Indigo-Violet) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <!-- Glowing Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer circle background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />
  
  <!-- Glowing orbit ring (representing Antigravity) -->
  <ellipse cx="256" cy="256" rx="200" ry="80" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.3" transform="rotate(-15 256 256)" filter="url(#glow)" />
  <ellipse cx="256" cy="256" rx="200" ry="80" fill="none" stroke="url(#accentGrad)" stroke-width="2" transform="rotate(-15 256 256)" />
  <circle cx="90" cy="210" r="10" fill="#ec4899" filter="url(#glow)" />
  <circle cx="422" cy="302" r="6" fill="#6366f1" filter="url(#glow)" />

  <!-- The stylized Book shape in the center -->
  <g transform="translate(128, 128)" filter="url(#glow)">
    <!-- Left Page -->
    <path d="M128,210 C70,210 20,180 20,180 L20,30 C20,30 70,60 128,60 C128,60 128,210 128,210 Z" fill="url(#accentGrad)" opacity="0.9" />
    <!-- Right Page -->
    <path d="M128,210 C186,210 236,180 236,180 L236,30 C236,30 186,60 128,60 C128,60 128,210 128,210 Z" fill="url(#accentGrad)" />
    <!-- Book Spine Glow -->
    <line x1="128" y1="50" x2="128" y2="215" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  </g>
  
  <!-- Floating particles representing knowledge / stars -->
  <circle cx="256" cy="90" r="8" fill="#ffffff" filter="url(#glow)" />
  <circle cx="200" cy="120" r="4" fill="#8b5cf6" opacity="0.8" />
  <circle cx="312" cy="110" r="5" fill="#ec4899" opacity="0.8" />
</svg>
