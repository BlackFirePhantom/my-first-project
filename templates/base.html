<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}小说阅读器{% endblock %}</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="apple-touch-icon" href="/static/icon.svg">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── 基础变量与设计系统 ── */
        :root {
            --bg: #0b0f19;
            --bg-card: #151d30;
            --bg-hover: #1e2942;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-glow: rgba(99, 102, 241, 0.35);
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent2: #4f46e5;
            --text: #f3f4f6;
            --text-dim: #9ca3af;
            --gold: #fbbf24;
            --green: #10b981;
            --red: #ef4444;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            --border: rgba(255, 255, 255, 0.06);
            
            /* 动态主题适配变量 */
            --bg-navbar: rgba(15, 23, 42, 0.75);
            --text-rgb: 243, 244, 246;

            /* 默认阅读器配置变量 */
            --reader-font-size: 1.15rem;
            --reader-line-height: 2.1;
            --reader-letter-spacing: 0.03em;
            --reader-width: 780px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            background-attachment: fixed;
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0, transparent 50%),
                              radial-gradient(at 50% 0%, rgba(168, 85, 247, 0.05) 0, transparent 50%);
        }

        /* ── 顶栏 ── */
        .navbar {
            background: var(--bg-navbar);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .navbar .brand {
            font-size: 1.35rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            margin-right: 2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            transition: transform 0.2s;
        }
        .navbar .brand:hover {
            transform: scale(1.02);
        }
        .navbar .brand svg {
            width: 26px;
            height: 26px;
            color: #6366f1;
            fill: currentColor;
        }
        .navbar nav { display: flex; gap: 0.5rem; }
        .navbar nav a {
            color: var(--text-dim);
            text-decoration: none;
            padding: 0.5rem 1.2rem;
            border-radius: var(--radius-sm);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.95rem;
            font-weight: 500;
        }
        .navbar nav a:hover {
            color: var(--text);
            background: var(--bg-hover);
        }
        .navbar nav a.active {
            color: #fff;
            background: var(--accent-gradient);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        /* ── 搜索栏 ── */
        .search-box {
            display: flex;
            margin-left: auto;
            gap: 0.6rem;
            align-items: center;
        }
        .search-box select {
            background: rgba(var(--text-rgb), 0.05);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.5rem 0.8rem;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .search-box select:focus {
            border-color: var(--accent);
            background: rgba(var(--text-rgb), 0.08);
        }
        .search-box input {
            background: rgba(var(--text-rgb), 0.05);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.5rem 1.2rem;
            color: var(--text);
            font-size: 0.9rem;
            width: 200px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }
        .search-box input:focus {
            border-color: var(--accent);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px var(--accent-glow);
            width: 250px;
        }
        .search-box input::placeholder { color: var(--text-dim); }
        .search-box button {
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 0.5rem 1.2rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .search-box button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px var(--accent-glow);
        }

        /* ── 主体容器 ── */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2.5rem 2rem;
        }

        /* ── 卡片 ── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.8rem;
            margin-bottom: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: var(--shadow-lg);
        }

        /* ── 按钮 ── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.65rem 1.5rem;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: none;
        }
        .btn-primary   { background: var(--accent-gradient); color: #fff; box-shadow: 0 4px 12px var(--accent-glow); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 18px var(--accent-glow); }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-2px); }
        .btn-sm        { padding: 0.45rem 1.1rem; font-size: 0.85rem; border-radius: 8px; }
        .btn-ghost {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover {
            color: var(--text);
            border-color: var(--text-dim);
            background: rgba(255, 255, 255, 0.05);
        }

        /* ── 标签 ── */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid transparent;
        }
        .badge-accent { background: rgba(99, 102, 241, 0.15); color: #818cf8; border-color: rgba(99, 102, 241, 0.2); }
        .badge-green  { background: rgba(16, 185, 129, 0.15); color: #34d399; border-color: rgba(16, 185, 129, 0.2); }
        .badge-gold   { background: rgba(251, 191, 36, 0.15); color: #fbbf24; border-color: rgba(251, 191, 36, 0.2); }

        /* ── 网格 ── */
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }

        /* ── 标题 ── */
        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .page-title .icon { font-size: 2rem; }

        .section-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 1.2rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid var(--border);
        }

        /* ── 空状态 ── */
        .empty-state {
            text-align: center;
            padding: 5rem 2rem;
            color: var(--text-dim);
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px dashed var(--border);
        }
        .empty-state .icon { font-size: 4rem; margin-bottom: 1.2rem; display: block; opacity: 0.6; }
        .empty-state p { font-size: 1.1rem; font-weight: 500; }

        /* ── 章节列表 ── */
        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.6rem;
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        .chapter-grid::-webkit-scrollbar { width: 6px; }
        .chapter-grid::-webkit-scrollbar-track { background: var(--bg); }
        .chapter-grid::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 10px; }
        .chapter-grid::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .chapter-item {
            display: block;
            padding: 0.75rem 1.2rem;
            color: var(--text-dim);
            text-decoration: none;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: rgba(255, 255, 255, 0.02);
        }
        .chapter-item:hover {
            background: var(--bg-hover);
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.05);
            transform: translateX(2px);
        }
        .chapter-item.current {
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent);
            border-color: rgba(99, 102, 241, 0.2);
            font-weight: 600;
            box-shadow: inset 3px 0 0 var(--accent);
        }
        .chapter-item .num {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-right: 0.4rem;
        }

        /* ── 阅读器 ── */
        .reader-container {
            max-width: var(--reader-width);
            margin: 0 auto;
            padding: 3rem 1.5rem;
            transition: max-width 0.3s ease;
        }
        .reader-header {
            text-align: center;
            margin-bottom: 2.5rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }
        .reader-header .novel-name {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
        }
        .reader-header .chapter-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text);
        }
        .reader-body {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 3.5rem 3rem;
            box-shadow: var(--shadow-lg);
            font-size: var(--reader-font-size);
            line-height: var(--reader-line-height);
            letter-spacing: var(--reader-letter-spacing);
            transition: all 0.3s ease;
        }
        .reader-body p {
            text-indent: 2em;
            margin-bottom: 1em;
            word-break: break-all;
        }
        .reader-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 1rem;
        }
        .reader-nav .center-btns {
            display: flex;
            gap: 0.6rem;
        }

        /* ── 全局页面加载遮罩 ── */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 300;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .loading-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
        }

        /* ── 提示条 ── */
        .alert {
            padding: 1rem 1.5rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .alert-info  { background: rgba(99, 102, 241, 0.1); color: #818cf8; border-color: rgba(99, 102, 241, 0.15); }
        .alert-error { background: rgba(239, 68, 68, 0.1); color: #f87171; border-color: rgba(239, 68, 68, 0.15); }

        /* ── 通知 ── */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: #fff;
            padding: 1rem 1.8rem;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            border-left: 4px solid var(--accent);
            transform: translateY(150%);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* ── 阅读设置面板 ── */
        .settings-fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px var(--accent-glow);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 150;
        }
        .settings-fab:hover { transform: scale(1.1) rotate(45deg); box-shadow: 0 6px 20px var(--accent-glow); }

        .settings-panel {
            position: fixed;
            bottom: 6rem;
            right: 2rem;
            width: 320px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 1.8rem;
            z-index: 150;
            transform: translateY(20px) scale(0.95);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .settings-panel.open {
            transform: translateY(0) scale(1);
            opacity: 1;
            pointer-events: auto;
        }
        .settings-panel h3 {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
        }
        .setting-row {
            margin-bottom: 1.4rem;
        }
        .setting-row:last-child { margin-bottom: 0; }
        .setting-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
            font-size: 0.9rem;
            color: var(--text-dim);
            font-weight: 500;
        }
        .setting-value {
            color: var(--text);
            font-weight: 600;
            font-size: 0.85rem;
            background: rgba(var(--text-rgb), 0.05);
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
        }
        .setting-row input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(var(--text-rgb), 0.08);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        .setting-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .setting-row input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        .setting-row input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: none;
        }
        .settings-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid var(--border);
        }
        .settings-actions .btn { flex: 1; text-align: center; font-size: 0.85rem; padding: 0.5rem; }

        /* ── 响应式 ── */
        @media (max-width: 768px) {
            .navbar { padding: 0 1.2rem; }
            .search-box { display: none; } /* 在小屏幕下隐藏顶部复杂搜索，用户可以去搜索页 */
            .container { padding: 1.2rem 1rem; }
            .reader-body { padding: 1.8rem 1.2rem; }
            .grid-2 { grid-template-columns: 1fr; }
            .settings-panel { width: calc(100vw - 2rem); right: 1rem; bottom: 5.5rem; }
        }

        @media (max-width: 480px) {
            .navbar {
                height: 60px;
                padding: 0 0.8rem;
                justify-content: space-between;
            }
            .navbar .brand {
                font-size: 1.1rem;
                margin-right: 0.5rem;
                gap: 0.4rem;
            }
            .navbar .brand svg {
                width: 20px;
                height: 20px;
            }
            .navbar nav a {
                padding: 0.4rem 0.8rem;
                font-size: 0.85rem;
            }
            .container {
                padding: 1rem 0.6rem;
            }
            .card {
                padding: 1.2rem;
                border-radius: var(--radius-sm);
            }
            .btn {
                padding: 0.55rem 1.2rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- 全局加载遮罩 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div style="color: var(--text-dim); font-size: 0.95rem; font-weight: 500; letter-spacing: 0.05em;">正在努力加载中...</div>
    </div>

    <!-- 顶栏 -->
    <header class="navbar">
        <a href="/" class="brand">
            <svg viewBox="0 0 24 24">
                <path d="M21 4H3a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1zM4 18V6h7v12H4zm9 0V6h7v12h-7z"/>
            </svg>
            小说阅读器
        </a>
        <nav>
            <div id="offline-badge" class="badge badge-gold" style="display: none; align-items: center; gap: 0.3rem; line-height: 1; align-self: center; margin-right: 0.5rem; flex-shrink: 0;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="flex-shrink:0;"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                离线
            </div>
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">首页</a>
            <a href="/search" class="{% if request.path == '/search' %}active{% endif %}">搜索</a>
        </nav>
        <form class="search-box" action="/search" method="get">
            <select name="source" id="source-select">
                <option value="">全部源</option>
                {% if sources %}
                {% for sid, sname in sources %}
                <option value="{{ sid }}" {% if request.args.get('source') == sid %}selected{% endif %}>{{ sname }}</option>
                {% endfor %}
                {% endif %}
            </select>
            <input type="text" name="q" placeholder="搜索小说..." value="{{ request.args.get('q', '') }}">
            <button type="submit">搜索</button>
        </form>
    </header>

    <!-- 通知 -->
    <div id="toast" class="toast"></div>

    <!-- 主体 -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script>
        // 全局加载遮罩控制
        function showLoading() {
            const o = document.getElementById('loadingOverlay');
            if (o) o.classList.add('show');
        }
        function hideLoading() {
            const o = document.getElementById('loadingOverlay');
            if (o) o.classList.remove('show');
        }

        // 通知
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg;
            if (isError) {
                t.style.borderLeftColor = 'var(--red)';
                t.style.color = '#f87171';
            } else {
                t.style.borderLeftColor = 'var(--green)';
                t.style.color = '#34d399';
            }
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // 绑定全局链接点击事件，展现 Loading
        document.addEventListener('click', function(e) {
            const a = e.target.closest('a');
            if (!a) return;
            const href = a.getAttribute('href');
            // 排除 javascript:, anchor links, 以及带 target="_blank" 链接
            if (href && !href.startsWith('javascript:') && !href.startsWith('#') && !a.getAttribute('target')) {
                showLoading();
            }
        });

        // 绑定所有表单提交展现 Loading
        document.addEventListener('submit', function(e) {
            // 排除无 action 的表单
            if (e.target.action) {
                showLoading();
            }
        });

        // 页面恢复显示时隐藏 Loading (处理浏览器后退问题)
        window.addEventListener('pageshow', function() {
            hideLoading();
        });

        // 添加到书架
        async function addToBookshelf(url, name, source) {
            try {
                const resp = await fetch('/api/bookshelf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, name, source: source || '' })
                });
                if (resp.ok) {
                    showToast('已成功添加到书架！');
                } else {
                    showToast('添加书架失败，请重试', true);
                }
            } catch (err) {
                showToast('网络错误，添加失败', true);
            }
        }

        // 从书架移除
        async function removeFromBookshelf(url) {
            if (!confirm('确定将此小说从书架移除吗？')) return;
            try {
                const resp = await fetch('/api/bookshelf/' + encodeURIComponent(url), {
                    method: 'DELETE'
                });
                if (resp.ok) {
                    showToast('已从书架移除');
                    setTimeout(() => location.reload(), 800);
                } else {
                    showToast('移除失败，请重试', true);
                }
            } catch (err) {
                showToast('网络错误，移除失败', true);
            }
        }

        // PWA Service Worker 注册与网络状态监听
        function updateOnlineStatus() {
            const badge = document.getElementById('offline-badge');
            if (badge) {
                if (navigator.onLine) {
                    badge.style.display = 'none';
                } else {
                    badge.style.display = 'inline-flex';
                    showToast('您已处于离线状态，可继续阅读本地缓存过的章节', false);
                }
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        
        window.addEventListener('load', () => {
            updateOnlineStatus();
            
            if ('serviceWorker' in navigator) {
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) {
                        window.location.reload();
                        refreshing = true;
                    }
                });

                navigator.serviceWorker.register('/sw.js?v=2')
                    .then(reg => {
                        console.log('Service Worker 注册成功:', reg.scope);
                        reg.update();
                    })
                    .catch(err => console.error('Service Worker 注册失败:', err));
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
